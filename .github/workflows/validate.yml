name: Validate rebuild
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: |
          npm start -- --port 3000 > /tmp/smarterteens.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          node scripts/smoke.mjs
