name: SmarterTeens quality gates
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: smarterteens-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Feature contract and changed-feature regression evidence
        run: npm run test:contract
        env:
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API integration and security smoke
        run: |
          node node_modules/next/dist/bin/next start --hostname localhost --port 3000 > /tmp/smarterteens.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then node scripts/smoke.mjs; exit $?; fi
            sleep 1
          done
          cat /tmp/smarterteens.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  authenticated-staging:
    needs: public-quality
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: smarterteens-staging
    steps:
      - name: Require dedicated staging configuration
        env:
          STAGING_DB_REF: ${{ vars.STAGING_DB_REF }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
          STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
          STAGING_OWNER_B_EMAIL: ${{ secrets.STAGING_OWNER_B_EMAIL }}
          STAGING_OWNER_B_PASSWORD: ${{ secrets.STAGING_OWNER_B_PASSWORD }}
        run: |
          for key in STAGING_DB_REF STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY STAGING_OWNER_A_EMAIL STAGING_OWNER_A_PASSWORD STAGING_OWNER_B_EMAIL STAGING_OWNER_B_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Missing dedicated staging setting $key"; exit 1; fi
          done
          node -e 'const u=new URL(process.env.STAGING_SUPABASE_URL); if(!/^[a-z0-9]{20}$/.test(process.env.STAGING_DB_REF)||u.href!=="https://"+process.env.STAGING_DB_REF+".supabase.co/")process.exit(1)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real authenticated tenant isolation and owner workflows
        run: npm run test:staging
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_DB_REF: ${{ vars.STAGING_DB_REF }}
          STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
          STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
          STAGING_OWNER_B_EMAIL: ${{ secrets.STAGING_OWNER_B_EMAIL }}
          STAGING_OWNER_B_PASSWORD: ${{ secrets.STAGING_OWNER_B_PASSWORD }}
  release-gate:
    name: smarterteens-release-gate
    if: always()
    needs: [public-quality, authenticated-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, skipped or cancelled validation
        env:
          PUBLIC_RESULT: ${{ needs.public-quality.result }}
          STAGING_RESULT: ${{ needs.authenticated-staging.result }}
        run: |
          echo "Public validation: $PUBLIC_RESULT"
          echo "Authenticated staging: $STAGING_RESULT"
          test "$PUBLIC_RESULT" = success
          test "$STAGING_RESULT" = success
