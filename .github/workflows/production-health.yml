name: SmarterTeens production health
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'
permissions:
  contents: read
concurrency:
  group: smarterteens-production-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SMARTERTEENS_HEALTH_ORIGIN: ${{ vars.SMARTERTEENS_HEALTH_ORIGIN }}
    steps:
      - name: Configuration gate
        if: env.SMARTERTEENS_HEALTH_ORIGIN == ''
        run: |
          echo "Monitoring not configured. Set SMARTERTEENS_HEALTH_ORIGIN after verified production cutover." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/monitor-readiness.mjs
